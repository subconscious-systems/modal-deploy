[project]
name = "modal-deploy"
version = "0.1.0"
description = "Deploy the timrun GLM-5.2 container onto Modal GPUs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=0.71.0",
]

[tool.uv]
# Keep the local dev env lean: we only need the Modal CLI here to drive
# `modal deploy` / `modal serve`. The heavy deps (sglang, fastapi, transformers)
# are installed inside the Modal container image, not locally.
